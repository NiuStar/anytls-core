name: Source Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    # Legacy source-only tags; these newer releases are explicitly binary-owned.
    if: github.ref_name != 'v2026-10-24-04' && github.ref_name != 'v2026-10-25-02' && github.ref_name != 'v2026-10-26-01' && (github.ref_name == 'v2026-10-19-01' || github.ref_name == 'v2026-10-21-01' || github.ref_name == 'v2026-10-21-02')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check version and prepare exact source
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "$(cat VERSION)" = "$TAG"
          mkdir -p dist
          git archive --format=tar.gz --prefix="anytls-core-${TAG}/" HEAD > "dist/anytls-core-${TAG}-source.tar.gz"
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "$TAG — AnyTLS macOS" --notes-file "docs/releases/${TAG}.md" --latest
