name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      GOTOOLCHAIN: local
      GOWORK: 'off'
      GOFLAGS: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache: true
      - name: Pin wrapper toolchain and cache paths
        run: |
          echo "TMPDIR=$HOME/.aq-ci" >> "$GITHUB_ENV"
          mkdir -p "$HOME/.aq-ci"
          echo "GO_BIN=$(command -v go)" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
      - name: Real Box patch regression
        run: python3 scripts/go-patched.py test -p=2 -tags=with_gvisor,with_utls,with_upstream_cleanup_patch,embedded_core -count=1 -v -run=^TestUpstreamStartPreservesCleanupErrors$ ./internal/engine
      - run: python3 scripts/tests/test-go-patched.py
      - name: Installer safety and preservation regressions
        run: |
          export TMPDIR="$RUNNER_TEMP/anytls-installer-tests"
          mkdir -p "$TMPDIR"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_binary_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_download_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_managed_webui_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_core_reload_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_core_argv_policy_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_process_rows_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_core_reload_durability_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_reconcile_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/install_operator_reconcile_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/bootstrap_reload_args_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/package_binary_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/package_menubar_test.py
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/update_binary_test.py
          bash -n install.sh
          bash -n install-control-helper.sh
      - run: python3 scripts/go-patched.py test -p=2 -tags=with_gvisor,with_utls,with_upstream_cleanup_patch,embedded_core ./...
      - name: Offline full-race CI contract regressions
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/ci_race_test.py
      - name: Full unfiltered native race qualification
        env:
          CGO_ENABLED: '1'
        run: python3 scripts/ci-race.py
      - name: Preserve full-race evidence on every platform
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-race-${{ matrix.os }}
          path: ${{ env.RACE_EVIDENCE }}
          if-no-files-found: warn
      - run: python3 scripts/go-patched.py vet -p=2 -tags=with_gvisor,with_utls,with_upstream_cleanup_patch,embedded_core ./...
      - run: mkdir -p dist
      - run: python3 scripts/go-patched.py build -p=2 -tags=with_gvisor,with_utls,with_upstream_cleanup_patch,embedded_core -trimpath -o dist/anytls-macos .
      - name: Build actual native macOS app and all five Swift fixtures
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          case "$(uname -m)" in
            arm64) app_arch=arm64 ;;
            x86_64) app_arch=amd64 ;;
            *) echo 'unsupported native architecture' >&2; exit 2 ;;
          esac
          test "$(dist/anytls-macos version)" = "$(tr -d '\r\n' < VERSION)"
          core_before="$(shasum -a 256 dist/anytls-macos)"
          CORE="$PWD/dist/anytls-macos" bash scripts/build-menubar.sh "$app_arch" "$PWD/build/menubar"
          test "$(shasum -a 256 dist/anytls-macos)" = "$core_before"
      - name: Run native Swift suites without production installation or WAN
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          # Short RunnerTemp-owned paths avoid Darwin's UNIX socket path limit.
          evidence="$(mktemp -d "$RUNNER_TEMP/aq.XXXXXX")"
          echo "MENUBAR_EVIDENCE=$evidence" >> "$GITHUB_ENV"
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/package-menubar.py --run-tests build/menubar/test --evidence "$evidence/native"
      - name: Preserve native evidence even on AppKit/GUI or assertion failure
        if: always() && runner.os == 'macOS' && env.MENUBAR_EVIDENCE != ''
        uses: actions/upload-artifact@v4
        with:
          name: menubar-ci-native-${{ matrix.os }}
          path: ${{ env.MENUBAR_EVIDENCE }}
          if-no-files-found: warn
